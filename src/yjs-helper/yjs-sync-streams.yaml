streams:
  yjs_update_stream:
    priority: 0
    with:
      document_ids: TODO # SELECT id FROM documents WHERE id = subscription.parameter('yjs_document_id')
    queries:
      - SELECT id, document_id, base64(update_data) as update_b64, fragment_index, fragment_count FROM yjs_updates WHERE document_id IN document_ids
  yjs_snapshot_stream:
    priority: 0
    with:
      document_ids: TODO # SELECT id FROM documents WHERE id = subscription.parameter('yjs_document_id')
    queries:
      - SELECT id, document_id, base64(snapshot_data) as snapshot_b64, fragment_index, fragment_count FROM yjs_snapshots WHERE document_id IN document_ids
